<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Validador de Logs</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 20px;
        }

        input[type="file"] {
            margin-top: 10px;
            width: 100%;
        }

        button {
            margin-top: 30px;
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: gray;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>Validador de Logs</h1>

    <form action="/procesar" method="POST" enctype="multipart/form-data">

        <label for="logs">Archivo de logs (.zip recomendado):</label>
        <input type="file" name="logs" accept=".zip,.txt" required>

        <button type="submit">Procesar</button>

    </form>

    <div class="footer">
        Sistema de validación de logs - Versión Web
    </div>

</div>

</body>
</html>
