<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Validador de Logs</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 20px;
        }

        input[type="file"] {
            margin-top: 10px;
            width: 100%;
        }

        button {
            margin-top: 30px;
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: gray;
        }
		
		
		input[type="file"] {
			padding: 8px;
			border: 1px solid #ccc;
			border-radius: 5px;
		}

		button:disabled {
			background-color: #95a5a6;
			cursor: not-allowed;
		}

		#loading {
			font-size: 14px;
		}
		
		
    </style>

</head>

<body>

<div class="container">

    <h1>Validador de Logs</h1>
	
	<p style="text-align:center; color: #555;">
		Seleccione un archivo ZIP con logs para ejecutar la validación.
	</p>

    <form action="/procesar" method="post" enctype="multipart/form-data" onsubmit="mostrarCarga()">

        <label for="logs">Archivo de logs (.zip recomendado):</label>
        <input type="file" name="logs" accept=".zip,.txt" required>

        <button type="submit" id="btnProcesar">Procesar</button>

    </form>

	
	<div id="loading" style="display:none; text-align:center; margin-top:20px;">
		<p style="font-weight:bold; color:#2c3e50;">Procesando archivo, por favor espere...</p>
		<div style="margin-top:10px;">⏳</div>
	</div>

    <div class="footer">
        Sistema de validación de logs - Versión Web
    </div>

</div>

	
<script>
	function mostrarCarga() {
		document.getElementById("loading").style.display = "block";
    
	const boton = document.getElementById("btnProcesar");
		boton.disabled = true;
		boton.innerText = "Procesando...";
	}
</script>

</body>
</html>
